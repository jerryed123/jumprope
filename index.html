<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>줄넘기 AI 카운터 v2</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Barlow+Condensed:wght@300;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07070a;
  --s1: #0f0f14;
  --s2: #161620;
  --border: #22222c;
  --text: #ddd8f0;
  --muted: #44445a;
  --muted2: #66667a;
  --success: #22c55e;
  --fail: #ef4444;
  --warn: #f59e0b;
  --info: #60a5fa;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Barlow Condensed', sans-serif;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 520px;
  margin: 0 auto;
}

/* HEADER */
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 16px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.hdr-title { font-size: 17px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
.hdr-sub { font-size: 10px; color: var(--muted2); letter-spacing: .18em; }
.hdr-btns { display: flex; gap: 6px; }
.icon-btn {
  background: var(--s2); border: 1px solid var(--border);
  color: var(--muted2); font-size: 13px; padding: 6px 10px;
  border-radius: 5px; cursor: pointer; font-family: inherit;
  font-size: 11px; letter-spacing: .08em; font-weight: 700; text-transform: uppercase;
}
.icon-btn:active { background: var(--border); }

/* CAMERA */
.cam-section { position: relative; background: #000; flex-shrink: 0; }
#video { width: 100%; height: auto; display: block; max-height: 42vh; object-fit: cover; }
#overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

.cam-overlay-ui {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
}
.status-bar {
  position: absolute; top: 8px; left: 8px;
  display: flex; align-items: center; gap: 5px;
  background: rgba(7,7,10,.85); border: 1px solid var(--border);
  padding: 4px 9px; border-radius: 20px;
  font-size: 10px; letter-spacing: .14em; font-weight: 700; text-transform: uppercase;
  backdrop-filter: blur(8px);
}
.sdot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
.sdot.live { background: var(--success); box-shadow: 0 0 6px var(--success); animation: blink 2s infinite; }
.sdot.warn { background: var(--warn); }
.sdot.err { background: var(--fail); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

.person-count-badge {
  position: absolute; top: 8px; right: 8px;
  background: rgba(7,7,10,.85); border: 1px solid var(--border);
  padding: 4px 9px; border-radius: 20px;
  font-size: 10px; letter-spacing: .14em; font-weight: 700; text-transform: uppercase;
  backdrop-filter: blur(8px); color: var(--muted2);
}
.person-count-badge span { color: var(--text); }

/* JUMP FLASH OVERLAYS per person - top/bottom halves */
.jump-flash {
  position: absolute; inset: 0; pointer-events: none;
  opacity: 0; transition: opacity .07s;
}
.jump-flash.on { opacity: 1; }

/* CAM PROMPT */
.cam-prompt {
  position: absolute; inset: 0; background: #000;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
}
.cam-prompt.hidden { display: none; }
.cam-prompt svg { opacity: .3; }
.cam-prompt-txt { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted2); text-align: center; }

.loading {
  position: absolute; inset: 0; background: rgba(7,7,10,.92);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  z-index: 10;
}
.loading.hidden { display: none; }
.spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--info); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-txt { font-size: 11px; letter-spacing: .15em; color: var(--muted2); text-transform: uppercase; }

/* PERSON CARDS */
.cards-section {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.cards-label {
  font-size: 10px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase;
  margin-bottom: 8px;
}
.cards-grid {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
  scrollbar-width: none;
}
.cards-grid::-webkit-scrollbar { display: none; }

.person-card {
  min-width: 110px; flex-shrink: 0;
  background: var(--s1); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px;
  position: relative; overflow: hidden;
  transition: border-color .2s;
}
.person-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--person-color);
}
.person-card.event-success { border-color: var(--success); }
.person-card.event-fail { border-color: var(--fail); }

.card-header {
  display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
}
.card-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--person-color);
  box-shadow: 0 0 6px var(--person-color);
}
.card-name { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--muted2); text-transform: uppercase; }

.card-counts { display: flex; gap: 8px; align-items: flex-end; }
.count-success {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 42px; line-height: 1;
  color: var(--person-color);
  text-shadow: 0 0 20px var(--person-color);
  transition: transform .08s;
}
.count-success.bump { transform: scale(1.15); }
.count-fail-block { display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; padding-bottom: 3px; }
.count-fail {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 18px; color: var(--fail); opacity: .8;
}
.count-fail-lbl { font-size: 9px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }

.card-rpm {
  margin-top: 6px;
  font-size: 10px; letter-spacing: .1em; color: var(--muted);
}
.card-rpm span { color: var(--warn); font-family: 'IBM Plex Mono', monospace; }

.card-event-badge {
  position: absolute; top: 8px; right: 8px;
  font-size: 9px; letter-spacing: .1em; font-weight: 700; text-transform: uppercase;
  padding: 2px 6px; border-radius: 3px; opacity: 0;
  transition: opacity .15s;
}
.card-event-badge.success { background: rgba(34,197,94,.15); color: var(--success); }
.card-event-badge.fail { background: rgba(239,68,68,.15); color: var(--fail); }
.card-event-badge.show { opacity: 1; }

.no-person {
  font-size: 11px; letter-spacing: .1em; color: var(--muted);
  padding: 14px 4px;
  text-align: center; width: 100%;
}

/* EVENT LOG */
.log-section {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  min-height: 58px;
}
.log-label { font-size: 10px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.log-items { display: flex; flex-direction: column; gap: 3px; }
.log-item {
  font-size: 11px; letter-spacing: .06em;
  display: flex; align-items: center; gap: 8px;
  animation: fadein .2s ease;
}
@keyframes fadein { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.log-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.log-time { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--muted); min-width: 38px; }

/* CONTROLS */
.controls {
  display: flex; gap: 8px; padding: 12px 14px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.btn {
  flex: 1; padding: 12px 4px; border: none; border-radius: 6px;
  font-family: 'Barlow Condensed', sans-serif; font-size: 14px;
  font-weight: 700; letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
  transition: all .12s;
}
.btn-start { background: var(--info); color: #000; flex: 2; }
.btn-start:active { transform: scale(.97); }
.btn-start:disabled { background: var(--muted); cursor: default; }
.btn-pause { background: var(--s2); color: var(--text); border: 1px solid var(--border); }
.btn-pause.paused { background: rgba(96,165,250,.12); border-color: var(--info); color: var(--info); }
.btn-pause:disabled { opacity: .35; cursor: default; }
.btn-pause:not(:disabled):active { transform: scale(.97); }
.btn-reset { background: transparent; color: var(--fail); border: 1px solid rgba(239,68,68,.4); }
.btn-reset:active { background: var(--fail); color: #fff; transform: scale(.97); }

/* SETTINGS */
.settings { padding: 10px 14px 14px; flex-shrink: 0; }
.setting-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.setting-lbl { font-size: 11px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; min-width: 70px; }
.setting-val { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--warn); min-width: 46px; text-align: right; }
input[type=range] {
  flex: 1; -webkit-appearance: none; height: 2px;
  background: var(--border); border-radius: 2px; outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
  background: var(--info); cursor: pointer;
}

.tip {
  margin: 0 14px 16px;
  border-left: 2px solid var(--muted);
  padding: 8px 12px;
  font-size: 11px; color: var(--muted2); line-height: 1.75; letter-spacing: .03em;
}
.tip b { color: var(--text); }
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-title">줄넘기 AI</div>
    <div class="hdr-sub">MULTI PERSON · FAIL DETECT</div>
  </div>
  <div class="hdr-btns">
    <button class="icon-btn" id="flip-btn">📷 전환</button>
  </div>
</div>

<!-- CAMERA -->
<div class="cam-section" id="cam-section">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div class="cam-overlay-ui">
    <div class="status-bar">
      <div class="sdot" id="sdot"></div>
      <span id="status-txt">대기중</span>
    </div>
    <div class="person-count-badge" id="pcnt-badge">인원 <span id="pcnt">0</span>명</div>
  </div>
  <div class="loading hidden" id="loading">
    <div class="spinner"></div>
    <div class="loading-txt" id="loading-txt">초기화중…</div>
  </div>
  <div class="cam-prompt" id="cam-prompt">
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.3">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
    <div class="cam-prompt-txt">시작 버튼을 눌러<br>카메라를 시작하세요</div>
  </div>
</div>

<!-- PERSON CARDS -->
<div class="cards-section">
  <div class="cards-label">참가자별 현황</div>
  <div class="cards-grid" id="cards-grid">
    <div class="no-person" id="no-person">카메라 시작 후 사람을 감지하면 자동으로 표시됩니다</div>
  </div>
</div>

<!-- EVENT LOG -->
<div class="log-section">
  <div class="log-label">이벤트 로그</div>
  <div class="log-items" id="log-items"></div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <button class="btn btn-start" id="start-btn">▶ 시작</button>
  <button class="btn btn-pause" id="pause-btn" disabled>일시정지</button>
  <button class="btn btn-reset" id="reset-btn">리셋</button>
</div>

<!-- SETTINGS -->
<div class="settings">
  <div class="setting-row">
    <span class="setting-lbl">점프 감도</span>
    <input type="range" id="sens-sl" min="5" max="60" value="20">
    <span class="setting-val" id="sens-v">20</span>
  </div>
  <div class="setting-row">
    <span class="setting-lbl">쿨다운</span>
    <input type="range" id="cd-sl" min="150" max="800" step="50" value="380">
    <span class="setting-val" id="cd-v">380ms</span>
  </div>
  <div class="setting-row">
    <span class="setting-lbl">실패 감도</span>
    <input type="range" id="fail-sl" min="20" max="80" value="45">
    <span class="setting-val" id="fail-v">45%</span>
  </div>
</div>

<div class="tip">
  💡 <b>점프 감도</b>: 낮추면 작은 움직임도 감지. 오감지 多 → 높이세요.<br>
  💡 <b>실패 감도</b>: 줄 걸림 판정 엄격도. 오판정 多 → 낮추세요.<br>
  💡 <b>각도</b>: 측면/정면/사선 모두 작동. 전신이 화면에 보이도록 1.5~2m 거리 유지.
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════
const PERSON_COLORS = ['#60a5fa','#f97316','#a78bfa','#4ade80','#f472b6','#fbbf24'];
const SKELETON_PAIRS = [
  [5,6],[5,7],[7,9],[6,8],[8,10],
  [5,11],[6,12],[11,12],
  [11,13],[13,15],[12,14],[14,16]
];
const HIP_IDX  = [11, 12];
const ANKLE_IDX = [15, 16];
const SHOULDER_IDX = [5, 6];

let baseSensitivity = 20;
let cooldownMs      = 380;
let failThreshold   = 0.45;   // amplitude drop ratio for fail
const RHYTHM_BREAK_RATIO = 1.85;
const HISTORY_MAX   = 50;
const STALE_MS      = 2200;   // remove person after 2.2s no detection
const LOG_MAX       = 5;

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let detector  = null;
let stream    = null;
let rafId     = null;
let isRunning = false;
let isPaused  = false;
let useRear   = false;

const persons = new Map();   // id -> PersonState

// ═══════════════════════════════════════════════════════════
//  PersonState
// ═══════════════════════════════════════════════════════════
class PersonState {
  constructor(id) {
    this.id        = id;
    this.color     = PERSON_COLORS[id % PERSON_COLORS.length];
    this.hipHist   = [];          // {y, t}
    this.intervals = [];          // ms between consecutive jumps
    this.ampHist   = [];          // pixel amplitudes of recent jumps
    this.lastJumpMs     = 0;
    this.lastFailMs     = 0;
    this.lastSeenMs     = 0;
    this.rhythmBreakArmed = false; // true = rhythm timer is "counting"
    this.successCount   = 0;
    this.failCount      = 0;
    this.jumpTimestamps = [];     // for RPM
    // Angle compensation: rolling shoulder/torso ratio
    this.angleRatio = 1.0;
  }

  updateAngle(kp) {
    const ls = kp[5], rs = kp[6], lh = kp[11], rh = kp[12];
    if (!ls || !rs || !lh || !rh) return;
    if (ls.score < 0.25 || rs.score < 0.25) return;
    const shoulderSpan = Math.abs(rs.x - ls.x);
    const hipY = (lh.y + rh.y) / 2;
    const shoulderY = (ls.y + rs.y) / 2;
    const torsoH = Math.max(Math.abs(hipY - shoulderY), 1);
    // ratio close to 1 = frontal, close to 0 = pure side
    const ratio = Math.min(shoulderSpan / torsoH, 1.5) / 1.5;
    this.angleRatio = this.angleRatio * 0.9 + ratio * 0.1;
  }

  effectiveSensitivity() {
    // Side view: ratio low → movements appear larger relative to body height → lower threshold OK
    // Front view: ratio high → horizontal jitter more prominent → need higher threshold
    // Scale: side ~0.6 ratio → multiplier ~1.1; front ~1.0 → multiplier ~0.85
    const m = 1.15 - this.angleRatio * 0.35;
    return baseSensitivity * m;
  }

  pushHip(y, now) {
    this.hipHist.push({y, t: now});
    if (this.hipHist.length > HISTORY_MAX) this.hipHist.shift();
  }

  detectJump(now) {
    const h = this.hipHist;
    if (h.length < 13) return null;
    if (now - this.lastJumpMs < cooldownMs) return null;
    const n  = h.length;
    const ai = n - 7;
    if (ai < 3) return null;

    const cy = h[ai].y;
    const by = avgWindow(h, ai - 3, ai);
    const fy = avgWindow(h, ai + 1, Math.min(ai + 4, n));
    const thr = this.effectiveSensitivity();

    if (cy < by - thr && cy < fy - thr) {
      const amplitude = ((by + fy) / 2) - cy;
      this.lastJumpMs = now;
      return this.classifyJump(amplitude, now);
    }
    return null;
  }

  classifyJump(amplitude, now) {
    let isFail = false;

    // Amplitude drop → stumble / rope caught
    if (this.ampHist.length >= 3) {
      const avgAmp = mean(this.ampHist);
      if (amplitude < avgAmp * failThreshold) isFail = true;
    }

    // Update amplitude history
    this.ampHist.push(amplitude);
    if (this.ampHist.length > 8) this.ampHist.shift();

    if (isFail) {
      this.failCount++;
      this.lastFailMs = now;
      this.rhythmBreakArmed = false;
      return 'fail';
    }

    // Success → update rhythm
    const prevJump = this.lastJumpMs; // already updated above
    // Note: lastJumpMs was set before classifyJump → use jumpTimestamps
    this.jumpTimestamps.push(now);
    if (this.jumpTimestamps.length > 12) this.jumpTimestamps.shift();

    if (this.jumpTimestamps.length >= 2) {
      const n = this.jumpTimestamps.length;
      const interval = now - this.jumpTimestamps[n - 2];
      if (interval < 1800) {
        this.intervals.push(interval);
        if (this.intervals.length > 6) this.intervals.shift();
      }
    }

    this.rhythmBreakArmed = this.intervals.length >= 3;
    this.successCount++;
    return 'success';
  }

  checkRhythmBreak(now) {
    if (!this.rhythmBreakArmed) return false;
    if (this.intervals.length < 3) return false;
    if (now - this.lastFailMs < 1200) return false;

    const avgInterval = mean(this.intervals);
    if (avgInterval > 1400) return false; // not actively jumping

    const gap = now - this.lastJumpMs;
    if (gap > avgInterval * RHYTHM_BREAK_RATIO && gap < 6000) {
      this.failCount++;
      this.lastFailMs = now;
      this.rhythmBreakArmed = false;
      this.intervals = []; // reset rhythm state
      return true;
    }
    return false;
  }

  rpm(now) {
    const recent = this.jumpTimestamps.filter(t => now - t < 10000);
    if (recent.length < 2) return null;
    return Math.round((recent.length - 1) / ((now - recent[0]) / 1000) * 60);
  }
}

// ═══════════════════════════════════════════════════════════
//  MATH HELPERS
// ═══════════════════════════════════════════════════════════
function avgWindow(arr, from, to) {
  let s = 0, c = 0;
  for (let i = Math.max(0, from); i < Math.min(arr.length, to); i++) { s += arr[i].y; c++; }
  return c ? s / c : 0;
}
function mean(arr) { return arr.reduce((a,b) => a+b, 0) / arr.length; }

function getHipY(kp) {
  const l = kp[11], r = kp[12];
  const lv = l?.score > 0.22, rv = r?.score > 0.22;
  if (lv && rv) return (l.y + r.y) / 2;
  if (lv) return l.y; if (rv) return r.y;
  return null;
}

// ═══════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════
async function startCamera() {
  const startBtn = document.getElementById('start-btn');
  const pauseBtn = document.getElementById('pause-btn');
  const loading  = document.getElementById('loading');
  const prompt   = document.getElementById('cam-prompt');
  prompt.classList.add('hidden');
  loading.classList.remove('hidden');
  startBtn.disabled = true;
  setStatus('카메라 열기…', 'warn');

  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: useRear ? {ideal:'environment'} : {ideal:'user'},
        width: {ideal:640}, height: {ideal:480}
      }, audio: false
    });
    const video = document.getElementById('video');
    video.srcObject = stream;
    video.style.transform = useRear ? '' : 'scaleX(-1)';
    await new Promise(r => { video.onloadedmetadata = r; });
    await video.play();

    const cv = document.getElementById('overlay');
    cv.width  = video.videoWidth;
    cv.height = video.videoHeight;

    if (!detector) {
      document.getElementById('loading-txt').textContent = 'MoveNet 로딩중…';
      setStatus('모델 로딩…', 'warn');
      await tf.setBackend('webgl');
      await tf.ready();
      detector = await poseDetection.createDetector(
        poseDetection.SupportedModels.MoveNet, {
          modelType: poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING,
          enableSmoothing: true,
          enableTracking: true,
          trackerType: poseDetection.TrackerType.BoundingBox,
          trackerConfig: { maxTracks: 6, trackerParams: {} }
        }
      );
    }

    loading.classList.add('hidden');
    setStatus('인식중', 'live');
    isRunning = true; isPaused = false;
    startBtn.textContent = '✓ 실행중';
    pauseBtn.disabled = false;
    loop();
  } catch(e) {
    loading.classList.add('hidden');
    prompt.classList.remove('hidden');
    prompt.querySelector('.cam-prompt-txt').textContent = '카메라 권한을 허용해 주세요\n' + e.message;
    setStatus('오류', 'err');
    startBtn.disabled = false;
    startBtn.textContent = '▶ 시작';
  }
}

function flipCamera() {
  useRear = !useRear;
  if (isRunning) {
    cancelAnimationFrame(rafId);
    isRunning = false;
    document.getElementById('start-btn').disabled = false;
    document.getElementById('start-btn').textContent = '▶ 시작';
    startCamera();
  }
}

// ═══════════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════════
async function loop() {
  if (!isRunning) return;

  const video = document.getElementById('video');
  if (!isPaused && video.readyState >= 2) {
    try {
      const poses = await detector.estimatePoses(video, {flipHorizontal: false});
      const now   = performance.now();
      const cv    = document.getElementById('overlay');
      const ctx   = cv.getContext('2d');
      ctx.clearRect(0, 0, cv.width, cv.height);

      const seenIds = new Set();

      for (const pose of poses) {
        const id = pose.id !== undefined ? pose.id : 0;
        seenIds.add(id);

        if (!persons.has(id)) persons.set(id, new PersonState(id));
        const p = persons.get(id);
        p.lastSeenMs = now;

        const kp = pose.keypoints;
        p.updateAngle(kp);

        const hipY = getHipY(kp);
        if (hipY !== null) {
          p.pushHip(hipY, now);
          const result = p.detectJump(now);
          if (result) onEvent(p, result, now);
        }

        // Rhythm break check (runs every frame, self-gates internally)
        if (p.checkRhythmBreak(now)) onEvent(p, 'fail', now);

        drawPoseSkeleton(ctx, kp, p.color);
      }

      // Purge stale persons
      for (const [id, p] of persons) {
        if (now - p.lastSeenMs > STALE_MS) persons.delete(id);
      }

      document.getElementById('pcnt').textContent = persons.size;
      setStatus(persons.size > 0 ? '인식중' : '사람 찾는중…', persons.size > 0 ? 'live' : 'warn');
      renderCards(now);

    } catch(e) { /* frame skip */ }
  }

  rafId = requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════
//  EVENT HANDLING
// ═══════════════════════════════════════════════════════════
function onEvent(p, type, now) {
  // Flash card
  const card = document.getElementById('card-' + p.id);
  if (card) {
    card.classList.remove('event-success', 'event-fail');
    void card.offsetWidth;
    card.classList.add(type === 'success' ? 'event-success' : 'event-fail');
    setTimeout(() => card.classList.remove('event-success', 'event-fail'), 350);

    const numEl = card.querySelector('.count-success');
    if (numEl && type === 'success') {
      numEl.textContent = p.successCount;
      numEl.classList.remove('bump');
      void numEl.offsetWidth;
      numEl.classList.add('bump');
      setTimeout(() => numEl.classList.remove('bump'), 130);
    }

    const badge = card.querySelector('.card-event-badge');
    if (badge) {
      badge.className = 'card-event-badge ' + type + ' show';
      badge.textContent = type === 'success' ? '✓ 성공' : '✗ 실패';
      setTimeout(() => badge.classList.remove('show'), 900);
    }
  }

  addLog(p, type, now);
}

// ═══════════════════════════════════════════════════════════
//  DRAW SKELETON
// ═══════════════════════════════════════════════════════════
function drawPoseSkeleton(ctx, kp, color) {
  const hexAlpha = (hex, a) => {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  };

  ctx.lineWidth = 2.5;
  for (const [a, b] of SKELETON_PAIRS) {
    if ((kp[a]?.score||0) > 0.2 && (kp[b]?.score||0) > 0.2) {
      const isHip = HIP_IDX.includes(a) || HIP_IDX.includes(b);
      ctx.strokeStyle = isHip ? hexAlpha(color, 0.95) : hexAlpha(color, 0.65);
      ctx.beginPath();
      ctx.moveTo(kp[a].x, kp[a].y);
      ctx.lineTo(kp[b].x, kp[b].y);
      ctx.stroke();
    }
  }
  for (let i = 0; i < kp.length; i++) {
    const k = kp[i];
    if (!k || k.score < 0.2) continue;
    const isHip = HIP_IDX.includes(i);
    ctx.beginPath();
    ctx.arc(k.x, k.y, isHip ? 7 : 4, 0, Math.PI * 2);
    ctx.fillStyle   = isHip ? color : hexAlpha(color, 0.8);
    ctx.shadowColor = isHip ? color : 'transparent';
    ctx.shadowBlur  = isHip ? 10 : 0;
    ctx.fill();
    ctx.shadowBlur  = 0;
  }
}

// ═══════════════════════════════════════════════════════════
//  RENDER CARDS
// ═══════════════════════════════════════════════════════════
function renderCards(now) {
  const grid   = document.getElementById('cards-grid');
  const noP    = document.getElementById('no-person');

  if (persons.size === 0) {
    noP.style.display = '';
    // Remove orphan cards
    grid.querySelectorAll('.person-card').forEach(c => c.remove());
    return;
  }
  noP.style.display = 'none';

  // Add missing cards
  for (const [id, p] of persons) {
    if (!document.getElementById('card-' + id)) {
      const card = buildCard(p);
      grid.appendChild(card);
    }
    // Update RPM
    const card = document.getElementById('card-' + id);
    if (card) {
      const rpm = p.rpm(now);
      card.querySelector('.rpm-val').textContent = rpm ? rpm + '/분' : '—';
      card.querySelector('.count-success').textContent = p.successCount;
      card.querySelector('.count-fail').textContent    = p.failCount;
      card.style.setProperty('--person-color', p.color);
    }
  }

  // Remove cards for deleted persons
  grid.querySelectorAll('.person-card').forEach(card => {
    const id = +card.dataset.id;
    if (!persons.has(id)) card.remove();
  });
}

function buildCard(p) {
  const card = document.createElement('div');
  card.className = 'person-card';
  card.id        = 'card-' + p.id;
  card.dataset.id = p.id;
  card.style.setProperty('--person-color', p.color);
  card.innerHTML = `
    <div class="card-header">
      <div class="card-dot"></div>
      <span class="card-name">P${p.id + 1}</span>
    </div>
    <div class="card-counts">
      <div class="count-success">${p.successCount}</div>
      <div class="count-fail-block">
        <div class="count-fail">${p.failCount}</div>
        <div class="count-fail-lbl">실패</div>
      </div>
    </div>
    <div class="card-rpm">속도 <span class="rpm-val">—</span></div>
    <div class="card-event-badge"></div>
  `;
  return card;
}

// ═══════════════════════════════════════════════════════════
//  LOG
// ═══════════════════════════════════════════════════════════
const logItems = [];

function addLog(p, type, now) {
  const t = new Date();
  const ts = t.getHours().toString().padStart(2,'0') + ':' +
             t.getMinutes().toString().padStart(2,'0') + ':' +
             t.getSeconds().toString().padStart(2,'0');

  const msg = type === 'success'
    ? `P${p.id+1} — 성공 (${p.successCount}회)`
    : `P${p.id+1} — 실패/걸림 (${p.failCount}회)`;

  logItems.unshift({ type, color: p.color, ts, msg });
  if (logItems.length > LOG_MAX) logItems.pop();

  const el = document.getElementById('log-items');
  el.innerHTML = logItems.map(it => `
    <div class="log-item">
      <div class="log-dot" style="background:${it.color}"></div>
      <span class="log-time">${it.ts}</span>
      <span style="color:${it.type==='success'?'var(--success)':'var(--fail)'}">
        ${it.msg}
      </span>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════════════════
function setStatus(txt, cls) {
  document.getElementById('status-txt').textContent = txt;
  const d = document.getElementById('sdot');
  d.className = 'sdot' + (cls ? ' ' + cls : '');
}

function togglePause() {
  isPaused = !isPaused;
  const btn = document.getElementById('pause-btn');
  btn.textContent = isPaused ? '▶ 재개' : '일시정지';
  btn.classList.toggle('paused', isPaused);
  setStatus(isPaused ? '일시정지' : '인식중', isPaused ? '' : 'live');
}

function resetAll() {
  persons.clear();
  logItems.length = 0;
  document.getElementById('log-items').innerHTML = '';
  document.getElementById('cards-grid').querySelectorAll('.person-card').forEach(c => c.remove());
  document.getElementById('no-person').style.display = '';
  document.getElementById('pcnt').textContent = '0';
}

// ═══════════════════════════════════════════════════════════
//  BIND EVENTS
// ═══════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('start-btn').addEventListener('click', startCamera);
  document.getElementById('pause-btn').addEventListener('click', togglePause);
  document.getElementById('reset-btn').addEventListener('click', resetAll);
  document.getElementById('flip-btn').addEventListener('click', flipCamera);

  document.getElementById('sens-sl').addEventListener('input', function() {
    baseSensitivity = +this.value;
    document.getElementById('sens-v').textContent = this.value;
  });
  document.getElementById('cd-sl').addEventListener('input', function() {
    cooldownMs = +this.value;
    document.getElementById('cd-v').textContent = this.value + 'ms';
  });
  document.getElementById('fail-sl').addEventListener('input', function() {
    failThreshold = this.value / 100;
    document.getElementById('fail-v').textContent = this.value + '%';
  });
});
</script>
